<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Matrix Diagonalization (GitHub Pages)</title>
  <style>
    body{font-family:Arial,sans-serif;margin:24px;background:#f6f8fc;color:#0f172a}
    .card{max-width:980px;background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .grid{display:grid;gap:8px;margin:14px 0}
    input,select,button{padding:8px;border-radius:8px;border:1px solid #cbd5e1}
    button{background:#2563eb;color:#fff;border:none;cursor:pointer}
    pre{background:#0b1220;color:#e2e8f0;padding:14px;border-radius:8px;overflow:auto}
  </style>
</head>
<body>
  <div class="card">
    <h2>Matrix Assignment Helper (GitHub Pages)</h2>
    <p>Works as static site. Calculation code is in separate file: <code>matrix_calc.js</code>.</p>

    <div class="row">
      <label for="size">Size:</label>
      <select id="size">
        <option value="2">2 x 2</option>
        <option value="3">3 x 3</option>
      </select>
      <button id="compute">Compute</button>
    </div>

    <div id="matrixGrid" class="grid"></div>

    <h3>Result</h3>
    <pre id="output">Fill matrix values then click Compute.</pre>
  </div>

  <script type="module">
    import { buildReport } from './matrix_calc.js';

    const sizeEl = document.getElementById('size');
    const grid = document.getElementById('matrixGrid');
    const output = document.getElementById('output');

    function buildInputs(){
      const n = Number(sizeEl.value);
      grid.style.gridTemplateColumns = `repeat(${n}, 90px)`;
      grid.innerHTML = '';
      for(let r=0;r<n;r++){
        for(let c=0;c<n;c++){
          const inp = document.createElement('input');
          inp.type='number';
          inp.step='any';
          inp.id = `a_${r}_${c}`;
          inp.value = r===c ? '1' : '0';
          grid.appendChild(inp);
        }
      }
    }

    function readMatrix(){
      const n = Number(sizeEl.value);
      return Array.from({length:n},(_,r)=>Array.from({length:n},(_,c)=>{
        const v = Number(document.getElementById(`a_${r}_${c}`).value);
        return Number.isFinite(v) ? v : 0;
      }));
    }

    document.getElementById('compute').addEventListener('click', ()=>{
      try{
        output.textContent = buildReport(readMatrix());
      }catch(err){
        output.textContent = `Error: ${err.message}`;
      }
    });

    sizeEl.addEventListener('change', buildInputs);
    buildInputs();
  </script>
</body>
</html>
